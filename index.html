    <script>
      (function () {
        // Guard against SecurityError when localStorage/sessionStorage are restricted inside a cross-origin Preview iframe
        function createMemoryStorage() {
          var map = {};
          return {
            getItem: function (k) {
              return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : null;
            },
            setItem: function (k, v) {
              map[k] = String(v);
            },
            removeItem: function (k) {
              delete map[k];
            },
            clear: function () {
              map = {};
            },
            key: function (i) {
              var keys = Object.keys(map);
              return keys[i] || null;
            },
            get length() {
              return Object.keys(map).length;
            }
          };
        }
        try {
          var ls = window.localStorage;
          ls.setItem('__saz_probe__', '1');
          ls.removeItem('__saz_probe__');
        } catch (_err) {
          try {
            Object.defineProperty(window, 'localStorage', {
              value: createMemoryStorage(),
              configurable: true,
              writable: true
            });
          } catch (_e2) {}
        }
        try {
          var ss = window.sessionStorage;
          ss.setItem('__saz_probe__', '1');
          ss.removeItem('__saz_probe__');
        } catch (_err) {
          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: createMemoryStorage(),
              configurable: true,
              writable: true
            });
          } catch (_e2) {}
        }
        // Unregister any stale service workers that could intercept Vite modules in Preview
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function () {});
          }
        } catch (_swErr) {}
      })();
